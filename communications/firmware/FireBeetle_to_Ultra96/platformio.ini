; Communications firmware: final Hip/Wrist builds and sampling diagnostics.
; Run PlatformIO commands from this directory.

[platformio]
default_envs = node1_final

[env]
platform = espressif32@7.1.0
board = firebeetle32
framework = espidf
monitor_speed = 115200
; Both deployed FireBeetles have 2 MiB of physical flash.
board_upload.flash_size = 2MB
board_build.partitions = partitions_2mb.csv
; Shared direct Wi-Fi/TLS pipeline; sensor capture remains at 100 Hz.
build_flags =
    -D APP_TRANSPORT_TLS=1
    -D APP_PHYSICAL_INTEGRATION=1
    -D APP_IDLE_RESUME_INTEGRATION=1
    -D APP_FEEDBACK_DIAGNOSTICS=1

; Final firmware: independent node joining, 1 ms scheduler tick,
; and server-controlled fall detection (ON at boot; Hip-only detection/reporting).
[env:node1_final]
build_flags =
    ${env.build_flags}
    -D APP_NODE_ID=1
    -D APP_ONE_NODE=1
    -D APP_FALL_DETECTION=1
    -D APP_FALL_RUNTIME_CONTROL=1
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.node1_base;sdkconfig.tick1000.defaults"

[env:node2_final]
build_flags =
    ${env.build_flags}
    -D APP_NODE_ID=2
    -D APP_ONE_NODE=1
    -D APP_FALL_DETECTION=1
    -D APP_FALL_RUNTIME_CONTROL=1
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.node2_base;sdkconfig.tick1000.defaults"

; Original sampling diagnostic baseline: 10 ms scheduler tick.
; Preserve the original behavior for comparison runs.
; Seed each SDK config as documented in SAMPLING_DIAGNOSTICS.md.
[env:node1_sampling_diag]
build_flags =
    ${env.build_flags}
    -D APP_NODE_ID=1
    -D APP_SAMPLING_DIAGNOSTICS=1

[env:node2_sampling_diag]
build_flags =
    ${env.build_flags}
    -D APP_NODE_ID=2
    -D APP_SAMPLING_DIAGNOSTICS=1

; Same diagnostic baseline with a 1 ms scheduler tick.
[env:node1_sampling_tick1000_diag]
extends = env:node1_sampling_diag
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.node1_base;sdkconfig.tick1000.defaults"

[env:node2_sampling_tick1000_diag]
extends = env:node2_sampling_diag
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.node2_base;sdkconfig.tick1000.defaults"
