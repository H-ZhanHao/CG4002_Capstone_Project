; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = node1_private_tls

[env]
platform = espressif32@7.1.0
board = firebeetle32
framework = espidf
monitor_speed = 115200
; The deployed FireBeetle boards report 2 MiB of physical flash.  Keep the
; image header, uploader, and partition table consistent with that hardware.
board_upload.flash_size = 2MB
board_build.partitions = partitions_2mb.csv

[env:node1]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=1
    -D APP_HUB_LOCAL_ONLY=1

[env:node2]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=2
    -D APP_HUB_LOCAL_ONLY=1

[env:node1_nus_wifi]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=1
    -D APP_WIFI_ENTERPRISE=1
    -D APP_WIFI_ASSOCIATION_ONLY=1
    -D APP_HUB_LOCAL_ONLY=1

[env:node2_nus_wifi]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=2
    -D APP_WIFI_ENTERPRISE=1
    -D APP_WIFI_ASSOCIATION_ONLY=1
    -D APP_HUB_LOCAL_ONLY=1

[env:node1_private_tls]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=1
    -D APP_HUB_LOCAL_ONLY=1
    -D APP_TRANSPORT_TLS=1
    -D APP_PHYSICAL_INTEGRATION=1

[env:node2_private_tls]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=2
    -D APP_HUB_LOCAL_ONLY=1
    -D APP_TRANSPORT_TLS=1
    -D APP_PHYSICAL_INTEGRATION=1

[env:node1_mock_tls]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=1
    -D APP_HUB_LOCAL_ONLY=1
    -D APP_TRANSPORT_TLS=1
    -D APP_PHYSICAL_INTEGRATION=1
    -D APP_USE_MOCK_IMU=1

[env:node2_mock_tls]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=2
    -D APP_HUB_LOCAL_ONLY=1
    -D APP_TRANSPORT_TLS=1
    -D APP_PHYSICAL_INTEGRATION=1
    -D APP_USE_MOCK_IMU=1
