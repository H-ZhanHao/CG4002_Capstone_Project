; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = node1_private_tls

[env]
platform = espressif32@7.1.0
board = firebeetle32
framework = espidf
monitor_speed = 115200
; The deployed FireBeetle boards report 2 MiB of physical flash.  Keep the
; image header, uploader, and partition table consistent with that hardware.
board_upload.flash_size = 2MB
board_build.partitions = partitions_2mb.csv

[env:node1]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=1
    -D APP_HUB_LOCAL_ONLY=1

[env:node2]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=2
    -D APP_HUB_LOCAL_ONLY=1

[env:node1_nus_wifi]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=1
    -D APP_WIFI_ENTERPRISE=1
    -D APP_WIFI_ASSOCIATION_ONLY=1
    -D APP_HUB_LOCAL_ONLY=1

[env:node2_nus_wifi]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=2
    -D APP_WIFI_ENTERPRISE=1
    -D APP_WIFI_ASSOCIATION_ONLY=1
    -D APP_HUB_LOCAL_ONLY=1

[env:node1_private_tls]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=1
    -D APP_HUB_LOCAL_ONLY=1
    -D APP_TRANSPORT_TLS=1
    -D APP_PHYSICAL_INTEGRATION=1

[env:node2_private_tls]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=2
    -D APP_HUB_LOCAL_ONLY=1
    -D APP_TRANSPORT_TLS=1
    -D APP_PHYSICAL_INTEGRATION=1

[env:node1_integration_update]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=1
    -D APP_HUB_LOCAL_ONLY=1
    -D APP_TRANSPORT_TLS=1
    -D APP_PHYSICAL_INTEGRATION=1
    -D APP_IDLE_RESUME_INTEGRATION=1

[env:node2_integration_update]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=2
    -D APP_HUB_LOCAL_ONLY=1
    -D APP_TRANSPORT_TLS=1
    -D APP_PHYSICAL_INTEGRATION=1
    -D APP_IDLE_RESUME_INTEGRATION=1

[env:node1_integration_100HZ]
extends = env:node1_integration_update

[env:node2_integration_100HZ]
extends = env:node2_integration_update

[env:node1_mock_tls]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=1
    -D APP_HUB_LOCAL_ONLY=1
    -D APP_TRANSPORT_TLS=1
    -D APP_PHYSICAL_INTEGRATION=1
    -D APP_USE_MOCK_IMU=1

[env:node2_mock_tls]
build_flags =
    -D APP_NODE_ROLE=1
    -D APP_NODE_ID=2
    -D APP_HUB_LOCAL_ONLY=1
    -D APP_TRANSPORT_TLS=1
    -D APP_PHYSICAL_INTEGRATION=1
    -D APP_USE_MOCK_IMU=1

; Independent local feedback diagnostics, preserving the 100 Hz TLS baseline.
[env:node1_stage1]
extends = env:node1_integration_100HZ
build_flags =
    ${env:node1_integration_update.build_flags}
    -D APP_STAGE1_FEEDBACK=1
    -D APP_FEEDBACK_DIAGNOSTICS=1

[env:node2_stage1]
extends = env:node2_integration_100HZ
build_flags =
    ${env:node2_integration_update.build_flags}
    -D APP_STAGE1_FEEDBACK=1
    -D APP_FEEDBACK_DIAGNOSTICS=1

; Cumulative Stage 2 firmware, independent of retained Stage 1 flash images.
[env:node1_stage2]
extends = env:node1_integration_100HZ
build_flags =
    ${env:node1_integration_update.build_flags}
    -D APP_FEEDBACK_DIAGNOSTICS=1

[env:node2_stage2]
extends = env:node2_integration_100HZ
build_flags =
    ${env:node2_integration_update.build_flags}
    -D APP_FEEDBACK_DIAGNOSTICS=1

; Stage 3: phone rep events use the existing Stage 2 ESP command path.
[env:node1_stage3]
extends = env:node1_stage2

[env:node2_stage3]
extends = env:node2_stage2

; Stage 4: AI idle feedback uses the existing nonblocking command path.
[env:node1_stage4]
extends = env:node1_stage3

[env:node2_stage4]
extends = env:node2_stage3

; Stage 5: local Hip fall alarm and acknowledged device event reporting.
[env:node1_stage5]
extends = env:node1_stage4

[env:node2_stage5]
extends = env:node2_stage4
