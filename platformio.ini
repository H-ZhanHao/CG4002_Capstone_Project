 [platformio]
default_envs = node1_private_tls
src_dir = hardware

[env]
platform = espressif32@7.1.0
board = firebeetle32
framework = espidf
monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter
extra_scripts = pre:hardware/platformio_paths.py
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB

; The environment name is a label, not a TLS configuration.
; Node 1 = hip, node 2 = wrist. Both use Bluetooth SPP + ESP-NOW.
[env:node1_private_tls]
build_flags = -DEXERCISE_NODE_ROLE=1

[env:node2_private_tls]
build_flags = -DEXERCISE_NODE_ROLE=2
